  contracts: 1
  allow_short: true
  adx_period: 14
  adx_entry_level: 25.0
  adx_exit_level: 20.0
  ema_period: 50
  atr_period: 14
  atr_stop_multiplier: 2.0
  margin_buffer: 1.05

backtest:
  plot: false
